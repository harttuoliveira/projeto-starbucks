<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starbucks</title>
  <link rel="stylesheet" href="settings/css/style.css">
  <link rel="shortcut icon" href="settings/img/logo.png" type="image/x-icon">
</head>
<body>
  <header>
    <div class="line"></div>
    <div class="container header-area">
      <div class="header-left">
        <a href="/"><img src="settings/img/logo.png" alt=""></a>
      </div>
      <div class="header-right">
        <div class="header-search">
          <form>
            <input type="text" name="search" placeholder="Search">
            <button>
              <img src="settings/img/loupe.png" alt="">
            </button>
          </form> 
        </div>
        <div class="header-menu">
          <img src="settings/img/menu.png" alt="">
        </div>
      </div>
    </div>
  </header>
  <section class="banner">
    <div class="container">
      <h1>Starbucks®<br>Happy Hour</h1>
      <span>We´ll meet you in your inbox. Drink deals are on their way.</span>
      <div class="banner-images">
        <img src="settings/img/c1.jpg" alt="">
        <img src="settings/img/c2.jpg" alt="">
        <img src="settings/img/c3.jpg" alt="">
      </div>
    </div>
  </section>
</body>
</html>
